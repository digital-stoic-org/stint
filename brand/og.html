<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>stint og</title>
<style>
:root{--paper:#f4ecd8;--ink:#1f1d1a;--ink-soft:#4a463e;--signal:#b93c0a;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
html,body{margin:0;padding:0;width:1200px;height:630px;background:var(--paper);overflow:hidden}
.card{width:1200px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.wm{display:flex;flex-direction:column;align-items:center;gap:22px;color:var(--ink)}
.wm svg{width:180px;height:180px;--acc:var(--signal);color:var(--ink)}
.word{font:800 64px/1 var(--mono);letter-spacing:.02em;color:var(--ink)}
.word .br{color:var(--signal)}
.tag{margin:40px 0 0;width:520px;font:500 28px/1.35 var(--sans);color:var(--ink-soft)}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
<defs>
  <symbol id="b2" viewBox="0 0 64 64">
    <g fill="none" transform="translate(0 2)">
      <path style="stroke:currentColor" stroke-width="3.5" stroke-linecap="round" d="M13.93 41.87L7.27 44.03M13.1 34.01L6.14 33.28M15.55 26.5L9.48 23M20.83 20.63L16.72 14.97M28.05 17.42L26.59 10.57M35.95 17.42L37.41 10.57M43.17 20.63L47.28 14.97"/>
      <path style="stroke:var(--acc,currentColor)" stroke-width="5" d="M47.59 27L56.25 22M49.9 34.12L59.85 33.07M49.12 41.56L58.63 44.65"/>
      <path style="stroke:currentColor" stroke-width="4" stroke-linecap="round" d="M32 36L39.71 21.98"/>
      <circle cx="32" cy="36" r="4.5" style="fill:currentColor"/>
    </g>
  </symbol>
</defs>
</svg>
<div class="card">
  <div class="wm">
    <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#b2"/></svg>
    <div class="word"><span class="br">[</span>stint<span class="br">]</span></div>
  </div>
  <p class="tag">Keep your Claude Code session under control: watch the context fill up, pit before it drifts, rejoin from the notes.</p>
</div>
</body>
</html>
